name: Keep backend warm

on:
  schedule:
    # Render free services sleep after inactivity; periodic health checks reduce
    # cold starts. GitHub may run scheduled jobs a few minutes late.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check backend health
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://mission17-backend.onrender.com/api/health
